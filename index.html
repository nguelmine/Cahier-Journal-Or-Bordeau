<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cahier Journal Numérique - FLE</title>
    <style>
        :root {
            --sidebar-bg: #1e293b;
            --sidebar-text: #f8fafc;
            --main-bg: #e2e8f0;
            --paper-bg: #ffffff;
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ea580c;
            --border: #cbd5e1;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--main-bg);
            color: #333;
        }

        /* --- Panneau de contrôle (Menu Latéral) --- */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.15);
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            color: #94a3b8;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-family: inherit;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
            text-align: center;
            font-size: 1rem;
        }

        .btn:hover { opacity: 0.9; }
        .btn-add { background-color: var(--success); margin-top: 10px; }
        .btn-print { background-color: var(--warning); margin-top: 20px; }
        .btn-clear { background-color: var(--danger); margin-top: auto; }

        /* --- Zone d'aperçu (Feuille A4) --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .a4-sheet {
            width: 297mm;
            min-height: 210mm;
            background-color: var(--paper-bg);
            padding: 20mm;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            color: #000;
        }

        .header-officiel {
            text-align: center;
            margin-bottom: 25px;
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.4;
        }

        .header-officiel h3 { margin: 0; font-size: 14pt; }
        .header-officiel p { margin: 0; font-size: 12pt; }
        .header-officiel h2 { margin: 15px 0 0; font-size: 18pt; text-decoration: underline; }

        .info-box {
            border: 2px solid #000;
            padding: 12px 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 11pt;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: top;
            font-size: 11pt;
            word-wrap: break-word;
        }

        th {
            background-color: #f1f5f9;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            text-align: center;
            font-weight: bold;
        }

        /* Largeurs de colonnes respectées */
        th:nth-child(1) { width: 10%; text-align: left; }
        th:nth-child(2) { width: 15%; }
        th:nth-child(3) { width: 20%; }
        th:nth-child(4) { width: 35%; }
        th:nth-child(5) { width: 15%; }
        th:nth-child(6) { width: 5%; text-align: center; }

        [contenteditable="true"] {
            outline: none;
            min-height: 25px;
            display: block;
        }

        [contenteditable="true"]:hover, [contenteditable="true"]:focus {
            background-color: #fef08a;
        }

        .delete-btn {
            color: red;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            display: block;
        }

        /* --- Mode Impression --- */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { background-color: white; height: auto; display: block; }
            .sidebar { display: none !important; }
            .main-content { padding: 0; display: block; overflow: visible; }
            .a4-sheet { 
                width: 100%; 
                min-height: 100%; 
                padding: 15mm; 
                box-shadow: none; 
            }
            .delete-col, .delete-btn { display: none !important; }
            [contenteditable="true"]:hover, [contenteditable="true"]:focus { 
                background-color: transparent !important; 
            }
            th:nth-child(6), td:nth-child(6) { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Panneau de contrôle -->
    <div class="sidebar">
        <h2>Paramètres de la séance</h2>
        
        <div class="form-group">
            <label>Date :</label>
            <input type="date" id="date-picker">
        </div>
        
        <div class="form-group">
            <label>Horaire :</label>
            <input type="text" id="horaire-input" placeholder="ex: 08h00 - 09h00" value="08h00 - 09h00">
        </div>
        
        <div class="form-group">
            <label>Niveau et Filière :</label>
            <select id="classe-input">
                <option value="1AS (TC Lettres)">1AS (TC Lettres)</option>
                <option value="1AS (TC Sciences)">1AS (TC Sciences)</option>
                <option value="2AS (Lettres/Philo)">2AS (Lettres/Philo)</option>
                <option value="2AS (Scientifique)">2AS (Scientifique)</option>
                <option value="2AS (Langues)">2AS (Langues)</option>
                <option value="3AS (Lettres/Philo)">3AS (Lettres/Philo)</option>
                <option value="3AS (Scientifique)">3AS (Scientifique)</option>
                <option value="3AS (Langues)">3AS (Langues)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Activité :</label>
            <select id="activite-input">
                <option value="Compréhension de l'écrit">Compréhension de l'écrit</option>
                <option value="Compréhension de l'oral">Compréhension de l'oral</option>
                <option value="Production écrite">Production écrite</option>
                <option value="Production de l'oral">Production de l'oral</option>
                <option value="Compte rendu">Compte rendu</option>
                <option value="Points de langue">Points de langue</option>
                <option value="Évaluation / Devoir">Évaluation / Devoir</option>
            </select>
        </div>
        
        <button class="btn btn-add" id="btn-add">+ Ajouter au cahier</button>
        <button class="btn btn-print" id="btn-print">🖨️ Imprimer / PDF</button>
        <button class="btn btn-clear" id="btn-clear">🗑️ Vider le cahier</button>
    </div>

    <!-- Feuille A4 -->
    <div class="main-content">
        <div class="a4-sheet">
            <div class="header-officiel">
                <h3>République Algérienne Démocratique et Populaire</h3>
                <p>Ministère de l'Éducation Nationale</p>
                <h2>CAHIER JOURNAL</h2>
            </div>
            
            <div class="info-box">
                <div>Enseignant : <strong>Noureddine Guelmine</strong></div>
                <div>Établissement : <strong>Lycée Chérif El-Idrissi - Hammam Dalaa</strong></div>
                <div id="display-date" style="text-transform: capitalize;"></div>
            </div>
            
            <table id="journal-table">
                <thead>
                    <tr>
                        <th>Horaire</th>
                        <th>Classe</th>
                        <th>Activité / Support</th>
                        <th>Objectifs d'apprentissage</th>
                        <th>Observations</th>
                        <th class="delete-col">X</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Les lignes s'afficheront ici -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const datePicker = document.getElementById('date-picker');
        const displayDate = document.getElementById('display-date');
        const tbody = document.querySelector('#journal-table tbody');

        // 1. Gestion de la date
        function updateDateDisplay() {
            if (!datePicker.value) return;
            const dateObj = new Date(datePicker.value);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            displayDate.textContent = dateObj.toLocaleDateString('fr-FR', options);
            saveData();
        }

        datePicker.addEventListener('change', updateDateDisplay);

        // Initialisation de la date au chargement
        const savedDate = localStorage.getItem('cahier_journal_date_v3');
        if (savedDate) {
            datePicker.value = savedDate;
        } else {
            datePicker.valueAsDate = new Date();
        }
        updateDateDisplay();

        // 2. Ajouter une séance
        document.getElementById('btn-add').addEventListener('click', () => {
            const horaire = document.getElementById('horaire-input').value;
            const classe = document.getElementById('classe-input').value;
            const activite = document.getElementById('activite-input').value;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td contenteditable="true">${horaire}</td>
                <td contenteditable="true"><strong>${classe}</strong><br><br>Projet :<br>Séquence :</td>
                <td contenteditable="true"><u>${activite}</u><br><br>Support :</td>
                <td contenteditable="true">- </td>
                <td contenteditable="true"></td>
                <td class="delete-col"><span class="delete-btn" title="Supprimer cette séance">❌</span></td>
            `;
            tbody.appendChild(tr);
            addCellListeners(tr);
            saveData();
        });

        // 3. Supprimer une séance
        tbody.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                if (confirm('Voulez-vous vraiment supprimer cette séance de votre cahier ?')) {
                    e.target.closest('tr').remove();
                    saveData();
                }
            }
        });

        // 4. Vider tout le cahier
        document.getElementById('btn-clear').addEventListener('click', () => {
            if (confirm('Attention, vous allez effacer toutes les séances de cette page. Continuer ?')) {
                tbody.innerHTML = '';
                saveData();
            }
        });

        // 5. Impression et Export PDF
        document.getElementById('btn-print').addEventListener('click', () => {
            window.print();
        });

        // 6. Sauvegarde locale (LocalStorage)
        function addCellListeners(row) {
            const cells = row.querySelectorAll('[contenteditable="true"]');
            cells.forEach(cell => {
                cell.addEventListener('input', saveData); // Sauvegarde à chaque touche tapée
                cell.addEventListener('blur', saveData);  // Sécurité supplémentaire quand on quitte la cellule
            });
        }

        function saveData() {
            localStorage.setItem('cahier_journal_data_v3', tbody.innerHTML);
            localStorage.setItem('cahier_journal_date_v3', datePicker.value);
        }

        // 7. Chargement des données au démarrage
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('cahier_journal_data_v3');
            if (savedData) {
                tbody.innerHTML = savedData;
                // Réattacher les événements de sauvegarde sur les cellules chargées depuis la mémoire
                tbody.querySelectorAll('tr').forEach(tr => addCellListeners(tr));
            }
        });
    </script>
</body>
</html>
